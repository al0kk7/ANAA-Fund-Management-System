{% extends "base.html" %}
{% block title %}Login - ANAA Fund Management System{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white p-8 rounded-lg shadow border border-slate-200">
    <h1 class="text-xl font-bold text-blue-900 mb-1">ANAA</h1>
    <p class="text-slate-500 text-sm mb-6">Fund Management System &mdash; Sign in</p>
    <form method="post">
        {% csrf_token %}
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" name="username" required
               class="w-full border border-slate-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-800">

        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full border border-slate-300 rounded px-3 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-800">

        <button type="submit"
                class="w-full bg-blue-900 hover:bg-blue-800 text-white font-medium py-2 rounded">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
